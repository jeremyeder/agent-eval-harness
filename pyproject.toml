[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "DoE/ANOVA evaluation harness for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
anova = [
    "scipy>=1.17",
    "statsmodels>=0.14",
    "pandas>=3.0",
    "pingouin>=0.6",
]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
include = ["agent_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
