name: rfe-speedrun-eval
skill: rfe.speedrun
runner: claude-code
runner_options:
  env_strip: []
mlflow_experiment: rfe-speedrun-eval

dataset:
  path: eval/dataset/cases
  schema: >
    Each case directory contains input.yaml with a 'prompt' field
    holding a Jira key (e.g. RHAIRFE-1473). The speedrun skill
    processes this key in Mode B (fetch, review, auto-fix, submit).

outputs:
  - path: artifacts/rfe-reviews
    schema: >
      Review files with YAML frontmatter containing: rfe_id, score (0-10),
      pass (bool), recommendation (submit/revise/split/reject), feasibility
      (feasible/infeasible/indeterminate), auto_revised (bool), and scores
      dict with what/why/open_to_how/not_a_task/right_sized (each 0-2).
  - path: artifacts/rfe-tasks
    schema: >
      RFE task files with YAML frontmatter containing the RFE content.
  - path: artifacts/auto-fix-runs
    schema: >
      Auto-fix run reports (YAML and HTML) from the auto-fix pipeline.

judges:
  - name: rubric_score
    module: eval.judges.frontmatter_judges
    function: rubric_score
  - name: pass_fail
    module: eval.judges.frontmatter_judges
    function: pass_fail
  - name: feasibility
    module: eval.judges.frontmatter_judges
    function: feasibility
  - name: score_what
    module: eval.judges.frontmatter_judges
    function: score_what
  - name: score_why
    module: eval.judges.frontmatter_judges
    function: score_why
  - name: score_open_to_how
    module: eval.judges.frontmatter_judges
    function: score_open_to_how
  - name: score_not_a_task
    module: eval.judges.frontmatter_judges
    function: score_not_a_task
  - name: score_right_sized
    module: eval.judges.frontmatter_judges
    function: score_right_sized
  - name: recommendation
    module: eval.judges.frontmatter_judges
    function: recommendation
  - name: auto_revised
    module: eval.judges.frontmatter_judges
    function: auto_revised

thresholds:
  rubric_score:
    min_mean: 6.0
  pass_fail:
    min_pass_rate: 0.5
