name: eval-analyze
description: Standard self-evaluation of the eval-analyze skill with source-backed offline cases.

execution:
  mode: case
  skill: eval-analyze
  arguments: "{{ input.prompt }}"

runner:
  type: codex
  plugin_dirs:
    - .

models:
  skill: gpt-5.6-luna

dataset:
  path: cases
  schema: |
    Each case directory contains input.yaml with:
    - prompt: an offline instruction for eval-analyze to analyze one source-backed skill definition.
    - source_files: the workspace paths the prompt names for the target skill and any referenced files.
    A field is external only when the analyzed source requires a real external system;
    Jira project data and Jira queries must be marked [EXTERNAL: Jira]. Do not invent
    external dependencies for local-only or nested-skill sources.
  workspace:
    files:
      - target/external-state/fake-jira-skill/SKILL.md
      - eval-setup/SKILL.md
      - eval-setup/scripts/check_env.py
      - eval-optimize/SKILL.md
      - eval-run/SKILL.md

outputs:
  - path: eval.yaml
    schema: The evaluation configuration generated by eval-analyze at the workspace root.

judges:
  - name: mlflow_guidelines
    mlflow_scorer: Guidelines
    model: gateway:/jeder-codex-endpoint
    feedback_type: bool
    arguments:
      guidelines: |
        The generated evaluation contract must be faithful to the analyzed skill.
        Pass only when fields, tools, outputs, and judges are grounded in files
        the agent actually read. Do not add generic safety or fixture policies.
